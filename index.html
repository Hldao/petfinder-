<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>护宠 · 内部预览</title>
<style>
  :root{--apricot:#E8743B;--apricot-light:#FFB088;--cream:#FBF7F0;--ink:#3A352E;--muted:#9a9384;--line:#ece6da;--mint:#4FAE96}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;background:#EDE7DB;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 60px}
  .wrap{width:100%;max-width:560px}
  .head{text-align:center;margin-bottom:34px}
  .logo{width:88px;height:88px;border-radius:24px;background:linear-gradient(150deg,var(--apricot-light),var(--apricot));display:inline-flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(232,116,59,.32);margin-bottom:18px}
  .logo svg{width:60%;height:60%}
  .head h1{font-size:30px;font-weight:900;letter-spacing:.04em}
  .head .sl{font-size:15px;color:var(--apricot);font-weight:700;margin-top:8px}
  .head .d{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.7}
  .head .d b{color:var(--ink)}
  .card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(120,100,70,.09);margin-bottom:16px;transition:.18s;border:1.5px solid transparent}
  .card:hover{transform:translateY(-2px);border-color:var(--apricot-light)}
  .card .row{display:flex;align-items:center;gap:16px}
  .card .em{width:54px;height:54px;border-radius:16px;background:var(--apricot-soft,#FFF1E8);display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0}
  .card .tt{flex:1}
  .card .tt .n{font-size:17px;font-weight:800}
  .card .tt .b{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .card .go{color:var(--apricot);font-size:22px;font-weight:800}
  .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--apricot);border-radius:20px;padding:3px 10px;margin-bottom:10px}
  .tag.mint{background:var(--mint)}
  .note{font-size:11.5px;color:#b3ab9c;line-height:1.8;text-align:center;margin-top:18px}
  .note b{color:var(--muted)}
  .tip{background:#FFF6E0;border:1px solid #f3e3b8;border-radius:14px;padding:12px 15px;font-size:12px;color:#9a7212;line-height:1.6;margin-bottom:26px;text-align:center}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">
        <svg viewBox="0 0 100 100">
          <path d="M50,13 L80,23 C80,49 73,69 50,88 C27,69 20,49 20,23 Z" fill="rgba(255,255,255,.2)"/>
          <g fill="#fff">
            <ellipse cx="40" cy="42" rx="3.7" ry="5.3" transform="rotate(-18 40 42)"/>
            <ellipse cx="47.5" cy="36" rx="4" ry="5.8" transform="rotate(-6 47.5 36)"/>
            <ellipse cx="55.8" cy="36" rx="4" ry="5.8" transform="rotate(6 55.8 36)"/>
            <ellipse cx="63" cy="42" rx="3.7" ry="5.3" transform="rotate(18 63 42)"/>
            <path d="M41,51 C41,45 46.5,44 51.5,44 C56.5,44 62,45 62,51 C62,58 56.5,63 51.5,63 C46.5,63 41,58 41,51 Z"/>
          </g>
        </svg>
      </div>
      <h1>护宠</h1>
      <div class="sl">守护每一次健康</div>
      <div class="d">大理宠物矩阵的一员 · 与 <b>寻宠</b> 同行<br>下面是我们做的原型和品牌方案，看看 👇</div>
    </div>

    <div class="tip">📱 这些是手机小程序的原型，<b>建议用手机打开</b>，或在电脑上看中间那个手机框。</div>

    <a class="card" href="./health-v3.html">
      <div class="tag">可点击体验</div>
      <div class="row">
        <div class="em">🩺</div>
        <div class="tt"><div class="n">护宠 · 健康原型</div><div class="b">健康首页 / 宠物档案 / 我的 / 自定义提醒 / 就诊记录，全部能点能玩</div></div>
        <div class="go">›</div>
      </div>
    </a>

    <a class="card" href="./concept-v1.html">
      <div class="tag mint">品牌方案</div>
      <div class="row">
        <div class="em">🎨</div>
        <div class="tt"><div class="n">护宠 · 品牌概念</div><div class="b">logo（盾护）、启动页、配色，以及和寻宠的矩阵家族关系</div></div>
        <div class="go">›</div>
      </div>
    </a>

    <div class="note">护宠 · 内部预览，暂请勿外传 🐾<br>找回走失 · 守护健康</div>
  </div>
</body>
</html>
